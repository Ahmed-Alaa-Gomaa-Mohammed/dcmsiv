[package]
name = "dcmsiv"
version = "0.1.0"
edition = "2021"
authors = ["dcmsiv contributors"]
description = "High-performance SIDEXIS DICOM recovery and sorter tool"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
csv = "1.3"
sha1 = "0.10"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
ctrlc = "3.4"

[dev-dependencies]
tempfile = "3.10"
